<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        width: 440px;
        height: 280px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 34px;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        color: #fff;
        background: radial-gradient(500px 300px at 10% 0%, #1f6f4a 0%, #0e2a20 60%, #08140f 100%);
      }

      img {
        width: 112px;
        height: 112px;
        flex: none;
      }

      h1 {
        font-size: 30px;
        line-height: 33px;
        letter-spacing: -0.5px;
      }

      p {
        margin-top: 10px;
        font-size: 15px;
        line-height: 20px;
        color: #b9d8c8;
      }
    </style>
  </head>
  <body>
    <img src="../../../icons/icon128.png" alt="" />
    <div>
      <h1>Mac Mode for WhatsApp Web</h1>
      <p>Mac shortcuts, SF Pro, and RTL that reads right.</p>
    </div>
  </body>
</html>
